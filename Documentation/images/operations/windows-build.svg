<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">Windowsビルドの手順</title><desc id="desc">Unityとゲームを閉じ、スクリプトで音声DLLとアプリを更新。フォルダー全体を配布し実機で確認する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#137b83" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fb"/><g font-family="'Yu Gothic','Hiragino Sans',sans-serif"><text x="30" y="42" font-size="26" fill="#172c41" font-weight="700">03 / Windows版を更新する</text><rect x="55" y="75" width="890" height="115" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="75" y="109" font-size="22" fill="#172c41" font-weight="700">1  Unityとゲームを終了</text><text x="75" y="141" font-size="17" fill="#172c41" font-weight="400">DLLのロックを解除する</text><text x="75" y="168" font-size="17" fill="#172c41" font-weight="400">試運転のPlayも停止</text><path d="M500 193 L500 220" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="225" width="890" height="115" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="75" y="259" font-size="22" fill="#172c41" font-weight="700">2  Windowsでビルド</text><text x="75" y="291" font-size="17" fill="#172c41" font-weight="400">Tools/Build-Windows.ps1</text><text x="75" y="318" font-size="17" fill="#172c41" font-weight="400">音声DLL → ゲームの順に作成</text><path d="M500 343 L500 370" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="375" width="890" height="115" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="75" y="409" font-size="22" fill="#172c41" font-weight="700">3  成功を確認して配布</text><text x="75" y="441" font-size="17" fill="#172c41" font-weight="400">Builds/Windows 全体をコピー</text><text x="75" y="468" font-size="17" fill="#172c41" font-weight="400">exe・Data・DLLを一緒に移動</text><text x="55" y="558" font-size="23" fill="#172c41" font-weight="700">4  2画面・ハンドル・ペダル・両席の音声で通しプレイ</text><text x="55" y="596" font-size="19" fill="#172c41" font-weight="400">EditorのPlay確認だけでは、Windowsアプリの実機確認は完了しません。</text></g></svg>