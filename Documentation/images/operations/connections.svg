<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">PCと機器の接続</title><desc id="desc">中央のゲームPCからP1とP2のモニターと音声へ出力。ESP32は1台をUSB接続。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#137b83" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fb"/><g font-family="'Yu Gothic','Hiragino Sans',sans-serif"><text x="32" y="42" font-size="26" fill="#172c41" font-weight="700">01 / つなぐものを確認する</text><rect x="370" y="185" width="260" height="150" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="390" y="219" font-size="22" fill="#172c41" font-weight="700">ゲームPC</text><text x="390" y="251" font-size="17" fill="#172c41" font-weight="400">Race.exe / Unity</text><text x="390" y="278" font-size="17" fill="#172c41" font-weight="400">管理画面の中継</text><text x="390" y="305" font-size="17" fill="#172c41" font-weight="400">USB・映像・音声を接続</text><rect x="40" y="80" width="270" height="120" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="60" y="114" font-size="22" fill="#172c41" font-weight="700">P1 モニター</text><text x="60" y="146" font-size="17" fill="#172c41" font-weight="400">映像：HDMI / DP</text><text x="60" y="173" font-size="17" fill="#172c41" font-weight="400">P1のタイトルを確認</text><rect x="690" y="80" width="270" height="120" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="710" y="114" font-size="22" fill="#172c41" font-weight="700">P2 モニター</text><text x="710" y="146" font-size="17" fill="#172c41" font-weight="400">映像：HDMI / DP</text><text x="710" y="173" font-size="17" fill="#172c41" font-weight="400">Windowsは追加画面が必要</text><rect x="40" y="280" width="270" height="140" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="60" y="314" font-size="22" fill="#172c41" font-weight="700">ESP32 × 1台</text><text x="60" y="346" font-size="17" fill="#172c41" font-weight="400">USBデータケーブル</text><text x="60" y="373" font-size="17" fill="#172c41" font-weight="400">両席のハンドル・ペダル</text><text x="60" y="400" font-size="17" fill="#172c41" font-weight="400">COM番号はWindowsで確認</text><rect x="690" y="280" width="270" height="140" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="710" y="314" font-size="22" fill="#172c41" font-weight="700">音声機器 × 2系統</text><text x="710" y="346" font-size="17" fill="#172c41" font-weight="400">P1とP2を別々に割り当て</text><text x="710" y="373" font-size="17" fill="#172c41" font-weight="400">USB / HDMIなど</text><text x="710" y="400" font-size="17" fill="#172c41" font-weight="400">OSで別の出力として認識</text><path d="M370 220 L310 160" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M630 220 L690 160" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M310 330 L370 285" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M630 285 L690 330" stroke="#137b83" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="38" y="476" font-size="22" fill="#172c41" font-weight="700">Windows：Win ＋ P → 拡張。接続がそろってからゲームを起動。</text><text x="38" y="512" font-size="19" fill="#172c41" font-weight="400">起動・校正中はハンドルを中央に置き、ペダルから足を離します。</text></g></svg>