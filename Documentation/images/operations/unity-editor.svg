<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img" aria-labelledby="title desc"><title id="title">Unity Editor操作ガイド</title><desc id="desc">上部のPlay、左のHierarchy、中央のGame、右のInspector、下部のProjectとConsoleを示す模式図。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#137b83" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fb"/><g font-family="'Yu Gothic','Hiragino Sans',sans-serif"><text x="30" y="40" font-size="26" fill="#172c41" font-weight="700">02 / Unity Editor の見方</text><text x="690" y="38" font-size="17" fill="#172c41" font-weight="400">説明用の模式図</text><rect x="25" y="65" width="950" height="510" rx="10" fill="#fff" stroke="#9ab5c3"/><rect x="25" y="65" width="950" height="55" rx="10" fill="#20364a"/><text x="44" y="99" font-size="18" fill="#fff" font-weight="400">File   Edit   Assets   GameObject   …   Racing</text><rect x="650" y="76" width="100" height="32" rx="5" fill="#bfe9e2"/><text x="664" y="99" font-size="20" fill="#172c41" font-weight="700">▶  Play</text><text x="783" y="99" font-size="18" fill="#fff" font-weight="400">Ⅱ  Pause</text><rect x="40" y="135" width="220" height="252" rx="14" fill="#eef5fa" stroke="#9ab5c3"/><text x="60" y="169" font-size="22" fill="#172c41" font-weight="700">① Hierarchy</text><text x="60" y="201" font-size="17" fill="#172c41" font-weight="400">GameManagers</text><text x="60" y="228" font-size="17" fill="#172c41" font-weight="400">  └ GManager</text><text x="60" y="255" font-size="17" fill="#172c41" font-weight="400">      ↑ クリックして選択</text><rect x="275" y="135" width="415" height="252" rx="14" fill="#e8f3f4" stroke="#9ab5c3"/><text x="295" y="169" font-size="22" fill="#172c41" font-weight="700">③ Game / Scene</text><text x="295" y="201" font-size="17" fill="#172c41" font-weight="400">Game：実際のプレイヤー映像</text><text x="295" y="228" font-size="17" fill="#172c41" font-weight="400">Display 1：P1</text><text x="295" y="255" font-size="17" fill="#172c41" font-weight="400">Display 3：P2（保存済み設定）</text><text x="295" y="282" font-size="17" fill="#172c41" font-weight="400">キー操作の前にここをクリック</text><rect x="705" y="135" width="255" height="420" rx="14" fill="#fff3df" stroke="#9ab5c3"/><text x="725" y="169" font-size="22" fill="#172c41" font-weight="700">② Inspector</text><text x="725" y="201" font-size="17" fill="#172c41" font-weight="400">選んだ物の設定</text><text x="725" y="228" font-size="17" fill="#172c41" font-weight="400">Input Manager (Script)</text><text x="725" y="255" font-size="17" fill="#172c41" font-weight="400">Is Debug Mode</text><text x="725" y="282" font-size="17" fill="#172c41" font-weight="400">  ON：キーボード検証</text><text x="725" y="309" font-size="17" fill="#172c41" font-weight="400">  OFF：本番実機</text><text x="725" y="336" font-size="17" fill="#172c41" font-weight="400">Gmanager (Script)</text><text x="725" y="363" font-size="17" fill="#172c41" font-weight="400">Displays</text><text x="725" y="390" font-size="17" fill="#172c41" font-weight="400">  Player Two Display</text><rect x="40" y="402" width="650" height="153" rx="14" fill="#eef5fa" stroke="#9ab5c3"/><text x="60" y="436" font-size="22" fill="#172c41" font-weight="700">④ Project / Console</text><text x="60" y="468" font-size="17" fill="#172c41" font-weight="400">Project → Assets → Scenes → SampleScene を開く</text><text x="60" y="495" font-size="17" fill="#172c41" font-weight="400">Console → 赤いエラーの内容を確認</text><text x="60" y="522" font-size="17" fill="#172c41" font-weight="400">停止後に設定を変更し、Ctrl＋Sで保存</text><text x="30" y="615" font-size="23" fill="#172c41" font-weight="700">▶ を押す：再生開始 ／ もう一度押す：停止</text><text x="30" y="650" font-size="19" fill="#172c41" font-weight="400">Ⅱ は一時停止。Play中の設定変更は通常、停止すると元に戻ります。</text></g></svg>